<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <title>Agenda de Bufete Jurídico</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="app">
    <aside class="menu">
      <div class="marca">
        <img src="img/logo.svg" alt="">
        <div><strong>Agenda</strong><span>de Bufete Jurídico</span></div>
      </div>
      <nav id="navegacion"></nav>
      <div class="usuario">
        <div class="avatar" id="avatar"></div>
        <div><div class="nombre" id="usuario-nombre"></div><div class="rol" id="usuario-rol"></div></div>
        <div class="acciones">
          <button id="btn-contrasena" title="Cambiar contraseña"></button>
          <button id="btn-salir" title="Cerrar sesión"></button>
        </div>
      </div>
    </aside>

    <main class="principal" id="principal">
      <header class="encabezado">
        <div><h1 id="titulo"></h1><div class="subtitulo" id="subtitulo"></div></div>
        <div class="derecha">
          <button class="campana" id="campana" title="Avisos"></button>
          <div id="accion-principal"></div>
        </div>
      </header>
      <div id="panel-avisos" class="panel-avisos" hidden></div>
      <div id="contenido"></div>
    </main>
  </div>

  <script src="js/comun.js"></script>
  <script src="js/vistas/panel.js"></script>
  <script src="js/vistas/clientes.js"></script>
  <script src="js/vistas/expedientes.js"></script>
  <script src="js/vistas/agenda.js"></script>
  <script src="js/vistas/radar.js"></script>
  <script src="js/vistas/usuarios.js"></script>
  <script src="js/vistas/respaldo.js"></script>
  <script src="js/vistas/reportes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
